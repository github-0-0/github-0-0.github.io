<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ascension github page (ignore slop for now)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #121212;
      color: #cbcbcb;
      font-family: 'Montserrat', sans-serif;
    }

    .nav {
      position: fixed;
      z-index: 1;
      top: 0;
      display: flex;
      width: 100%;
      height: 72px;
      align-items: center;
      justify-content: space-between;
      padding: 0 6vw;
      border-bottom: 1px solid #2a2a2a;
      background: rgb(18 18 18 / 88%);
      backdrop-filter: blur(12px);
    }

    .brand { color: #f1f1f1; font-size: 1rem; font-weight: 700; text-decoration: none; }
    .nav-link { color: #a8a8a8; font-size: .85rem; text-decoration: none; }
    .nav-link:hover { color: #f1f1f1; }

    .intro {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .intro-copy { position: relative; max-width: 750px; padding: 24px; text-align: center; }

    h1 {
      margin: 0 0 16px;
      color: #f1f1f1;
      font-size: clamp(2.8rem, 9vw, 6.25rem);
      font-weight: 700;
      letter-spacing: -0.07em;
    }

    p {
      margin: 0;
      color: #a8a8a8;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.5;
    }

    .scroll-cue {
      display: inline-block;
      position: absolute;
      bottom: 34px;
      color: #777;
      font-size: .72rem;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .practice { display: grid; min-height: 60vh; place-items: center; padding: 90px 24px; }
    .practice-card { max-width: 560px; padding: 34px; border: 1px solid #3d3d3d; border-radius: 12px; background: #1b1b1b; text-align: center; }
    h2 { margin: 0 0 12px; color: #f1f1f1; font-size: 1.7rem; }
    .practice-card p { margin-bottom: 25px; font-size: .95rem; }

    .button {
      display: inline-block;
      padding: 12px 18px;
      border: 1px solid #4b4b4b;
      border-radius: 6px;
      background: #242424;
      color: #f1f1f1;
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    .button:hover { background: #333; transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #77aaff; outline-offset: 4px; }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="index.html">ascension0001</a>
    <a class="nav-link" href="#practice">Sat Prep App</a>
  </nav>

  <main>
    <section class="intro" aria-labelledby="welcome-title">
      <canvas id="intro-canvas" aria-hidden="true"></canvas>
      <div class="intro-copy">
        <h1 id="welcome-title">Placeholder</h1>
        <p>Lorem ipsum</p>
      </div>
    </section>

    <section class="practice" id="practice" aria-labelledby="practice-title">
      <div class="practice-card">
        <h2 id="practice-title">SAT Practice</h2>
        <p>Customizable SAT practice app</p>
        <a class="button" href="index2.html">Open SAT practice</a>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('intro-canvas');
    const context = canvas.getContext('2d');

    function drawCanvas() {
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * scale;
      canvas.height = window.innerHeight * scale;
      context.setTransform(scale, 0, 0, scale, 0, 0);

      const { innerWidth: width, innerHeight: height } = window;
      const gradient = context.createRadialGradient(width * .5, height * .42, 0, width * .5, height * .42, Math.max(width, height) * .6);
      gradient.addColorStop(0, '#1e1e1e');
      gradient.addColorStop(1, '#121212');
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      context.strokeStyle = 'rgba(203, 203, 203, .12)';
      context.lineWidth = 1;
      const spacing = 42;
      for (let x = 0; x < width; x += spacing) {
        context.beginPath(); context.moveTo(x, 0); context.lineTo(x, height); context.stroke();
      }
      for (let y = 0; y < height; y += spacing) {
        context.beginPath(); context.moveTo(0, y); context.lineTo(width, y); context.stroke();
      }
    }

    drawCanvas();
    window.addEventListener('resize', drawCanvas);
  </script>
</body>
</html>
