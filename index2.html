<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start a Practice Session | SAT Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { max-width: 900px; margin: 40px auto; padding: 0 16px; background: #121212; color: #cbcbcb; color-scheme: dark; font: 16px/1.5 Montserrat, sans-serif; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; } h1, h2 { margin-top: 0; } a, button, select { font: inherit; } .nav a, button, select { border: 1px solid #4b4b4b; border-radius: 6px; padding: 9px 12px; background: #242424; color: #cbcbcb; text-decoration: none; } button { cursor: pointer; } button:hover { background: #333; } button:disabled { cursor: not-allowed; opacity: .55; }
    #setup-panel { max-width: 680px; padding: 24px; border: 1px solid #3d3d3d; border-radius: 12px; background: #1b1b1b; } #filters, .setup-options { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; } .filter-group { min-width: 170px; margin: 0; padding: 10px; border: 1px solid #4b4b4b; border-radius: 6px; } .filter-group legend { padding: 0 4px; font-size: .9rem; } .filter-options { display: grid; gap: 6px; } .filter-options label { display: flex; align-items: center; gap: 6px; font-size: .9rem; } .setup-options label { display: grid; gap: 6px; } #setup-message { min-height: 1.5em; margin-top: 12px; color: #aaa; }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Practice navigation"><h1>Start a session</h1><a href="review.html">Past questions</a></nav>
  <main id="setup-panel">
    <h2>Choose your practice</h2>
    <div id="filters">
      <fieldset class="filter-group"><legend>Difficulty</legend><div class="filter-options" id="difficulty-filter"></div></fieldset>
      <fieldset class="filter-group"><legend>Domain</legend><div class="filter-options" id="domain-filter"></div></fieldset>
    </div>
    <div class="setup-options">
      <label>Questions<select id="question-count"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="20">20 questions</option><option value="30">30 questions</option><option value="50">50 questions</option><option value="all">All matching questions</option></select></label>
      <label>Timer<select id="timer-length"><option value="0" selected>No limit</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option></select></label>
    </div>
    <button id="start-session" type="button" disabled>Start session</button>
    <div id="setup-message">Loading questions…</div>
  </main>
  <script src="questionbank.js"></script>
  <script>
    const performanceKey = "sat-practice.question-performance", pendingKey = "sat-practice.pending-session";
    const difficultyFilter = document.getElementById("difficulty-filter"), domainFilter = document.getElementById("domain-filter"), questionCount = document.getElementById("question-count"), timerLength = document.getElementById("timer-length"), startButton = document.getElementById("start-session"), message = document.getElementById("setup-message");
    let questions = [];
    function read(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
    function populate(container, values, name) { [...new Set(values)].sort().forEach(value => { const label = document.createElement("label"), input = document.createElement("input"); input.type = "checkbox"; input.name = name; input.value = value; input.onchange = updateMessage; label.append(input, document.createTextNode(value)); container.appendChild(label); }); }
    function matching() { const difficulties = new Set([...difficultyFilter.querySelectorAll("input:checked")].map(input => input.value)), domains = new Set([...domainFilter.querySelectorAll("input:checked")].map(input => input.value)); return questions.filter(question => (!difficulties.size || difficulties.has(question.difficulty)) && (!domains.size || domains.has(question.domain))); }
    function weightedOrder(ids, count) { const performance = read(performanceKey, {}), pool = ids.map(id => ({ id, weight: Math.max(.05, Number(performance[id]?.weight) || 1) })), result = []; while (pool.length && result.length < count) { let target = Math.random() * pool.reduce((sum, item) => sum + item.weight, 0), picked = pool.length - 1; for (let index = 0; index < pool.length; index++) { target -= pool[index].weight; if (target <= 0) { picked = index; break; } } result.push(pool.splice(picked, 1)[0].id); } return result; }
    function updateMessage() { const count = matching().length; message.textContent = count ? `${count} question${count === 1 ? "" : "s"} match your filters.` : "No questions match these filters."; startButton.disabled = !count; }
    startButton.onclick = () => { const matchingQuestions = matching(), count = questionCount.value === "all" ? matchingQuestions.length : Number(questionCount.value), order = weightedOrder(matchingQuestions.map(question => question.id), count); try { sessionStorage.setItem(pendingKey, JSON.stringify({ order, timerMinutes: Number(timerLength.value) })); window.location.href = "practice.html"; } catch { message.textContent = "Unable to start this session because browser session storage is unavailable."; } };
    try { if (typeof window.getQuestions !== "function") throw new Error("Question bank unavailable"); questions = window.getQuestions(); if (questions.some(question => typeof question.id !== "string" || !question.id) || new Set(questions.map(question => question.id)).size !== questions.length) throw new Error("Question IDs are invalid"); populate(difficultyFilter, questions.map(question => question.difficulty), "difficulty"); populate(domainFilter, questions.map(question => question.domain), "domain"); updateMessage(); } catch { message.textContent = "Unable to load questions. Try reloading the page."; }
  </script>
</body>
</html>
