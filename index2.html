<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Questions</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    #question svg *,
    .question-copy svg * {
      fill: #cbcbcb !important;
      stroke: #cbcbcb !important;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      max-width: 900px;
      margin: 40px auto;
      line-height: 1.5;
      padding: 0 16px;
      background: #121212;
      color: #cbcbcb;
      color-scheme: dark;
    }
    button,
    select,
    option,
    input,
    textarea {
      font-family: inherit;
    }
    #meta {
      color: gray;
      margin-bottom: 10px;
      font-size: 14px;
    }
    #question {
      font-size: 20px;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    #question svg,
    .question-copy svg {
      display: block;
      max-width: 100%;
      height: auto;
    }
    #question table,
    .question-copy table {
      border-collapse: collapse;
      max-width: 100%;
    }
    #question th,
    #question td,
    .question-copy th,
    .question-copy td {
      border: 1px solid #555;
      padding: 6px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .choice {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #4b4b4b;
      border-radius: 8px;
      background: #242424;
      color: #cbcbcb;
      cursor: pointer;
    }
    .choice:hover {
      background: #333;
    }
    .choice.correct {
      background: #1f6e3b;
    }
    .choice.wrong {
      background: #8b2f3f;
    }
    #feedback {
      margin-top: 20px;
      white-space: pre-wrap;
    }
    button#next {
      margin-top: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }
    #progress {
      color: gray;
      margin-bottom: 10px;
    }
    #quiz-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: 32px;
      align-items: start;
    }
    #answer-panel {
      padding: 20px;
      border: 1px solid #3d3d3d;
      border-radius: 12px;
      background: #1b1b1b;
    }
    @media (min-width: 701px) {
      #quiz-layout {
        height: calc(100vh - 210px);
        min-height: 420px;
      }
      #question-panel,
      #answer-panel {
        height: 100%;
        overflow-y: auto;
      }
    }
    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0 0 20px;
    }
    .filter-group {
      min-width: 160px;
      margin: 0;
      padding: 10px;
      border: 1px solid #4b4b4b;
      border-radius: 6px;
    }
    .filter-group legend { padding: 0 4px; font-size: 14px; }
    .filter-options { display: grid; gap: 6px; }
    .filter-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    #setup-panel {
      max-width: 520px;
      padding: 24px;
      border: 1px solid #3d3d3d;
      border-radius: 12px;
      background: #1b1b1b;
    }
    .setup-options,
    #session-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .setup-options label {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setup-options select,
    #start-session,
    #new-session,
    button#next {
      padding: 9px 12px;
      border: 1px solid #4b4b4b;
      border-radius: 6px;
      background: #242424;
      color: #cbcbcb;
    }
    #start-session {
      margin-top: 20px;
      cursor: pointer;
    }
    .page-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .page-nav a, .secondary-button {
      color: #cbcbcb;
      text-decoration: none;
      border: 1px solid #4b4b4b;
      border-radius: 6px;
      background: #242424;
      padding: 9px 12px;
      cursor: pointer;
    }
    .page-nav a:hover, .secondary-button:hover { background: #333; }
    #results-new-session {
      padding: 9px 12px;
      border: 1px solid #4b4b4b;
      border-radius: 6px;
      background: #242424;
      color: #cbcbcb;
      cursor: pointer;
    }
    #setup-message {
      min-height: 1.5em;
      margin-top: 12px;
      color: #aaa;
    }
    #results-panel {
      max-width: 900px;
      margin: 0 auto;
    }
    #results-summary {
      margin-bottom: 24px;
    }
    .missed-question {
      margin: 20px 0;
      padding: 24px;
      border: 1px solid #3d3d3d;
      border-radius: 12px;
      background: #1b1b1b;
    }
    .missed-question h2 {
      margin: 0 0 8px;
      color: #cbcbcb;
      font-size: 1.1rem;
    }
    .missed-question .question-copy {
      margin: 16px 0;
      font-size: 1rem;
    }
    .answer-review {
      margin: 12px 0 0;
      padding: 12px;
      border-radius: 6px;
    }
    .answer-review.your-answer { background: #54232d; }
    .answer-review.correct-answer { background: #173f28; }
    .answer-review strong { color: #cbcbcb; }
    .rationale { margin-top: 16px; white-space: pre-wrap; }
    #session-header {
      justify-content: space-between;
      margin-bottom: 10px;
    }
    #timer {
      font-variant-numeric: tabular-nums;
      font-weight: bold;
    }
    @media (max-width: 700px) {
      #quiz-layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <nav class="page-nav" aria-label="Practice navigation">
    <h1>Practice</h1>
    <a href="review.html">Past questions</a>
  </nav>
  <section id="setup-panel">
    <h2>Start a practice session</h2>
    <div id="filters">
      <fieldset class="filter-group">
        <legend>Difficulty</legend>
        <div class="filter-options" id="difficulty-filter"></div>
      </fieldset>
      <fieldset class="filter-group">
        <legend>Domain</legend>
        <div class="filter-options" id="domain-filter"></div>
      </fieldset>
    </div>
    <div class="setup-options">
      <label for="question-count">Questions
        <select id="question-count">
          <option value="5">5 questions</option><option value="10" selected>10 questions</option>
          <option value="20">20 questions</option><option value="30">30 questions</option>
          <option value="50">50 questions</option><option value="all">All matching questions</option>
        </select>
      </label>
      <label for="timer-length">Timer
        <select id="timer-length">
          <option value="0" selected>No limit</option><option value="5">5 minutes</option>
          <option value="10">10 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option>
        </select>
      </label>
    </div>
    <button id="start-session" disabled>Start session</button>
    <div id="setup-message">Loading questions…</div>
  </section>
  <div id="session-header" hidden>
    <div id="progress"></div>
    <div id="timer"></div>
    <button id="new-session">New session</button>
  </div>
  <main id="quiz-layout" hidden>
    <section id="question-panel">
      <div id="meta"></div>
      <div id="question"></div>
    </section>
    <section id="answer-panel">
      <div id="answers"></div>
      <div id="feedback"></div>
      <button id="next">Next</button>
    </section>
  </main>
  <section id="results-panel" hidden aria-labelledby="results-title">
    <h1 id="results-title">Session results</h1>
    <p id="results-summary"></p>
    <div id="missed-questions"></div>
    <button id="results-new-session">Start a new session</button>
  </section>
  <script src="questionbank.js"></script>
  <script>

    const progress = document.getElementById("progress");
    const meta = document.getElementById("meta");
    const questionBox = document.getElementById("question");
    const answersBox = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("next");
    const questionPanel = document.getElementById("question-panel");
    const answerPanel = document.getElementById("answer-panel");
    const difficultyFilter = document.getElementById("difficulty-filter");
    const domainFilter = document.getElementById("domain-filter");
    const setupPanel = document.getElementById("setup-panel");
    const sessionHeader = document.getElementById("session-header");
    const quizLayout = document.getElementById("quiz-layout");
    const questionCount = document.getElementById("question-count");
    const timerLength = document.getElementById("timer-length");
    const startSessionBtn = document.getElementById("start-session");
    const newSessionBtn = document.getElementById("new-session");
    const setupMessage = document.getElementById("setup-message");
    const timer = document.getElementById("timer");
    const resultsPanel = document.getElementById("results-panel");
    const resultsSummary = document.getElementById("results-summary");
    const missedQuestionsBox = document.getElementById("missed-questions");
    const resultsNewSessionBtn = document.getElementById("results-new-session");
    const rememberedQuestionIdsKey = "sat-practice.remembered-question-ids";
    const missedQuestionRecordsKey = "sat-practice.missed-question-records";
    const questionPerformanceKey = "sat-practice.question-performance";
    const sessionHistoryKey = "sat-practice.sessions";
    let questions = [];
    let questionsById = new Map();

    function readStoredValue(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    function writeStoredValue(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // Browsers with storage disabled can still use the practice session.
      }
    }

    function rememberedQuestionIds() {
      const ids = readStoredValue(rememberedQuestionIdsKey, []);
      return new Set(Array.isArray(ids) ? ids : []);
    }

    function rememberQuestion(questionId) {
      const ids = rememberedQuestionIds();
      ids.add(questionId);
      writeStoredValue(rememberedQuestionIdsKey, [...ids]);
    }

    function saveMissedQuestion(questionId, selectedChoice) {
      const records = readStoredValue(missedQuestionRecordsKey, {});
      const safeRecords = records && typeof records === "object" && !Array.isArray(records) ? records : {};
      safeRecords[questionId] = { selectedChoice, missedAt: new Date().toISOString() };
      writeStoredValue(missedQuestionRecordsKey, safeRecords);
    }

    function recordAnswer(questionId, isCorrect) {
      const records = readStoredValue(questionPerformanceKey, {});
      const safeRecords = records && typeof records === "object" && !Array.isArray(records) ? records : {};
      const previous = safeRecords[questionId] || {};
      const attempts = Number(previous.attempts) || 0;
      const correct = Number(previous.correct) || 0;
      const misses = Number(previous.misses) || 0;
      const weight = Number(previous.weight) || 1;
      safeRecords[questionId] = {
        attempts: attempts + 1,
        correct: correct + (isCorrect ? 1 : 0),
        misses: misses + (isCorrect ? 0 : 1),
        weight: Math.max(0.05, Math.min(100, weight * (isCorrect ? 0.5 : 1.5)))
      };
      writeStoredValue(questionPerformanceKey, safeRecords);
    }

    function sessions() {
      const records = readStoredValue(sessionHistoryKey, []);
      return Array.isArray(records) ? records : [];
    }

    function saveSessions(records) {
      writeStoredValue(sessionHistoryKey, records);
    }

    function updateCurrentSession(update) {
      const records = sessions();
      const session = records.find(record => record.id === currentSessionId);
      if (!session) return;
      update(session);
      saveSessions(records);
    }

    function createSession() {
      currentSessionId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const records = sessions();
      records.push({
        id: currentSessionId,
        startedAt: new Date().toISOString(),
        questionIds: [...order],
        answers: {},
        score: 0
      });
      saveSessions(records);
    }

    function recordSessionAnswer(questionId, selectedChoice, isCorrect) {
      updateCurrentSession(session => {
        session.answers[questionId] = { selectedChoice, isCorrect, answeredAt: new Date().toISOString() };
        session.score = score + (isCorrect ? 1 : 0);
      });
    }

    function completeCurrentSession(timedOut) {
      updateCurrentSession(session => {
        session.endedAt = new Date().toISOString();
        session.timedOut = timedOut;
        session.score = score;
      });
    }

    function populateFilter(container, values, name) {
      [...new Set(values)].sort().forEach(value => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = name;
        input.value = value;
        input.onchange = updateSetupMessage;
        label.append(input, document.createTextNode(value));
        container.appendChild(label);
      });
    }

    function shuffleIndices(n) {
      const arr = Array.from({ length: n }, (_, i) => i);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let filteredQuestionIds = [];
    let order = [];
    let orderIndex = 0;
    let currentQuestionId;
    let currentSessionId;
    let score = 0;
    let answered = false;
    let selectedButtons = [];
    let missedQuestions = [];
    let timerInterval;
    let sessionEndsAt = 0;

    function loadQuestion() {
      answered = false;
      selectedButtons = [];
      questionPanel.scrollTop = 0;
      answerPanel.scrollTop = 0;

      const q = questionsById.get(currentQuestionId);
      rememberQuestion(q.id);

      progress.textContent = `Question ${orderIndex + 1}/${order.length} | Score: ${score}`;
      meta.textContent = `${q.domain} • ${q.skill} • ${q.difficulty}`;
      questionBox.innerHTML = q.question;
      answersBox.innerHTML = "Answers";
      feedback.textContent = "";

      const choices = q.answers
        .split(/\n\s*\n/)
        .map(s => s.trim())
        .filter(Boolean);

      choices.forEach((answer, i) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = String.fromCharCode(65 + i) + ". " + answer;
        btn.onclick = () => selectAnswer(btn, i);
        selectedButtons.push(btn);
        answersBox.appendChild(btn);
      });
    }

    function selectAnswer(button, choice) {
      if (answered) return;
      answered = true;

      const q = questionsById.get(currentQuestionId);
      const correct = q.correct; // zero-based index: 0=A, 1=B, 2=C, 3=D

      if (choice === correct) {
        recordAnswer(q.id, true);
        recordSessionAnswer(q.id, choice, true);
        button.classList.add("correct");
        feedback.textContent = "Correct!\n\n" + q.rationale;
        score++;
      } else {
        recordAnswer(q.id, false);
        recordSessionAnswer(q.id, choice, false);
        missedQuestions.push({ questionId: q.id, selectedChoice: choice });
        saveMissedQuestion(q.id, choice);
        button.classList.add("wrong");
        feedback.textContent =
          "Incorrect.\n\n" +
          "Correct answer: " + String.fromCharCode(65 + correct) + "\n\n" +
          q.rationale;

        if (selectedButtons[correct]) {
          selectedButtons[correct].classList.add("correct");
        }
      }
    }

    nextBtn.onclick = () => {
      orderIndex++;
      if (orderIndex >= order.length) {
        finishSession(false);
        return;
      }

      currentQuestionId = order[orderIndex];
      loadQuestion();
    };

    function matchingQuestions() {
      const difficulties = new Set([...difficultyFilter.querySelectorAll("input:checked")].map(input => input.value));
      const domains = new Set([...domainFilter.querySelectorAll("input:checked")].map(input => input.value));
      return questions.filter(q =>
        (!difficulties.size || difficulties.has(q.difficulty)) &&
        (!domains.size || domains.has(q.domain))
      );
    }

    function weightedOrder(questionIds, count) {
      const performance = readStoredValue(questionPerformanceKey, {});
      const pool = questionIds.map(id => ({
        id,
        weight: Math.max(0.05, Number(performance[id]?.weight) || 1)
      }));
      const result = [];
      while (pool.length && result.length < count) {
        const total = pool.reduce((sum, item) => sum + item.weight, 0);
        let target = Math.random() * total;
        let selectedIndex = pool.length - 1;
        for (let index = 0; index < pool.length; index++) {
          target -= pool[index].weight;
          if (target <= 0) { selectedIndex = index; break; }
        }
        result.push(pool.splice(selectedIndex, 1)[0].id);
      }
      return result;
    }

    function updateSetupMessage() {
      const count = matchingQuestions().length;
      setupMessage.textContent = count
        ? `${count} question${count === 1 ? "" : "s"} match your filters.`
        : "No questions match these filters.";
      startSessionBtn.disabled = !count;
    }

    function prepareSession() {
      filteredQuestionIds = matchingQuestions().map(question => question.id);
      if (!filteredQuestionIds.length) return false;

      score = 0;
      missedQuestions = [];
      orderIndex = 0;
      const requestedCount = questionCount.value === "all"
        ? filteredQuestionIds.length
        : Number(questionCount.value);

      order = weightedOrder(filteredQuestionIds, requestedCount);
      currentQuestionId = order[orderIndex];
      nextBtn.style.display = "";
      return true;
    }

    function formatTime(seconds) {
      return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function clearTimer() {
      window.clearInterval(timerInterval);
      timerInterval = undefined;
    }

    function startTimer() {
      clearTimer();
      const minutes = Number(timerLength.value);
      if (!minutes) {
        timer.textContent = "No timer";
        return;
      }

      sessionEndsAt = Date.now() + minutes * 60 * 1000;
      const tick = () => {
        const secondsLeft = Math.max(0, Math.ceil((sessionEndsAt - Date.now()) / 1000));
        timer.textContent = `Time: ${formatTime(secondsLeft)}`;
        if (!secondsLeft) finishSession(true);
      };
      tick();
      timerInterval = window.setInterval(tick, 250);
    }

    function finishSession(timedOut) {
      clearTimer();
      completeCurrentSession(timedOut);
      progress.textContent = `${timedOut ? "Time's up" : "Finished"}! Score: ${score}/${order.length}`;
      if (timedOut) timer.textContent = "Time: 00:00";
      quizLayout.hidden = true;
      resultsPanel.hidden = false;
      renderResults(timedOut);
    }

    function choicesFor(question) {
      return question.answers
        .split(/\n\s*\n/)
        .map(choice => choice.trim())
        .filter(Boolean);
    }

    function renderResults(timedOut) {
      const completed = timedOut ? "Time expired" : "Session complete";
      resultsSummary.textContent = `${completed}: ${score} of ${order.length} correct. ${missedQuestions.length} question${missedQuestions.length === 1 ? "" : "s"} to review.`;
      missedQuestionsBox.innerHTML = "";

      if (!missedQuestions.length) {
        const message = document.createElement("p");
        message.textContent = score === order.length
          ? "Perfect score — there are no missed questions to review."
          : "There are no incorrect answers to review.";
        missedQuestionsBox.appendChild(message);
        return;
      }

      missedQuestions.forEach(({ questionId, selectedChoice }, index) => {
        const question = questionsById.get(questionId);
        if (!question) return;
        const choices = choicesFor(question);
        const card = document.createElement("article");
        card.className = "missed-question";

        const heading = document.createElement("h2");
        heading.textContent = `Missed question ${index + 1}`;
        const details = document.createElement("div");
        details.id = `missed-meta-${index}`;
        details.textContent = `${question.domain} • ${question.skill} • ${question.difficulty}`;
        const prompt = document.createElement("div");
        prompt.className = "question-copy";
        prompt.innerHTML = question.question;
        const selected = document.createElement("div");
        selected.className = "answer-review your-answer";
        selected.innerHTML = `<strong>Your answer:</strong> ${String.fromCharCode(65 + selectedChoice)}. `;
        selected.append(document.createTextNode(choices[selectedChoice]));
        const correct = document.createElement("div");
        correct.className = "answer-review correct-answer";
        correct.innerHTML = `<strong>Correct answer:</strong> ${String.fromCharCode(65 + question.correct)}. `;
        correct.append(document.createTextNode(choices[question.correct]));
        const rationale = document.createElement("p");
        rationale.className = "rationale";
        rationale.textContent = question.rationale;

        card.append(heading, details, prompt, selected, correct, rationale);
        missedQuestionsBox.appendChild(card);
      });
    }

    function startSession() {
      if (!prepareSession()) return;
      try {
        sessionStorage.setItem("sat-practice.pending-session", JSON.stringify({
          order,
          timerMinutes: Number(timerLength.value)
        }));
        window.location.href = "practice.html";
      } catch {
        setupMessage.textContent = "Unable to start this session because browser session storage is unavailable.";
      }
    }

    function returnToMenu() {
      clearTimer();
      setupPanel.hidden = false;
      sessionHeader.hidden = true;
      quizLayout.hidden = true;
      resultsPanel.hidden = true;
      updateSetupMessage();
    }

    startSessionBtn.onclick = startSession;
    newSessionBtn.onclick = returnToMenu;
    resultsNewSessionBtn.onclick = returnToMenu;

    async function loadQuestions() {
      try {
        if (typeof window.getQuestions !== "function") throw new Error("Question bank did not load");
        questions = window.getQuestions();
        questionsById = new Map(questions.map(question => [question.id, question]));
        if (questionsById.size !== questions.length || questions.some(question => typeof question.id !== "string" || !question.id)) {
          throw new Error("Every question needs a unique string id");
        }
        populateFilter(difficultyFilter, questions.map(q => q.difficulty), "difficulty");
        populateFilter(domainFilter, questions.map(q => q.domain), "domain");
        updateSetupMessage();
      } catch (error) {
        setupMessage.textContent = "Unable to load questions. Open this page through a local web server, then try again.";
      }
    }

    loadQuestions();
  </script>
</body>
</html>
